# ═══════════════════════════════════════════════════════════════
# PROJECT SENTINEL — CAPABILITY REGISTRY (machine-readable)
# Sentinel Law §6/§11/§33/§34 enforcement artifact.
# RULE: A capability whose contract is INCOMPLETE may never
#       enter production implementation.
# RULE: autonomy_level may never be raised without owner sign-off
#       recorded in change_log.
# last_audited: 2026-09-05 · registry_owner: store_owner
# ═══════════════════════════════════════════════════════════════

meta:
  system: "Sentinel / NOOR — OPPO Experience Store Khanewal"
  evidence_grades: {A: directly_verified, B: deterministically_derived, C: estimated_inferred, D: unavailable}
  autonomy_levels: {L0: read_only, L1: interpret, L2: compute, L3: recommend, L4: execute_under_policy, L5: sensitive_requires_approval}
  statuses: [VERIFIED_PRODUCTION, CONDITIONAL_PRODUCTION, PILOT, PROTOTYPE, BLOCKED, REDESIGN_REQUIRED, NOT_PROVEN]

# ─── TIER-1 FULL CONTRACTS (§6 schema) — Phase 2/3 candidates ───

capabilities:

  CAP-001-verified-event-ingestion:
    claim: "Every Meta webhook is authenticated, deduplicated, and durably logged BEFORE any processing."
    purpose: "Foundation of all trust; kills duplicate-reply and spoofing (DEBT-02/03/05)."
    inputs:
      - {field: "X-Hub-Signature-256", source: meta_webhook_header, authority: meta_hmac_with_app_secret, freshness: per_request}
      - {field: "message.wamid", source: meta_webhook_payload, authority: meta, freshness: per_request}
    processing: {type: rule_engine, algorithm: "HMAC-SHA256 compare + seen-set", deterministic: true, model: none, version: n/a}
    output: {type: "event_envelope{VERIFIED|FAILED|DUPLICATE}", evidence_grade: A}
    permissions: {can_read: [webhook_payload], can_infer: [], can_recommend: [], can_execute: [log_event], human_approval_required: false}
    failure_states:
      insufficient_data: "REJECT 400, log"
      authentication_failure: "REJECT 403, alert owner, never process"
      provider_failure: "n/a (we are receiver)"
      timeout: "n/a"
      model_uncertainty: "n/a"
    verification:
      method: "attack suite: replay same webhook 10x → 1 effect; forged signature → rejected; LIVE boot without secret → refused"
      acceptance_criteria: "0/10 duplicates; 100% forged rejected; boot gate proven"
      reproducibility: "jest integration, any machine"
    production_status: PILOT   # VR-2026-09-06-01: 5/5 attack+happy-path proofs green; real Meta traffic pending (Phase-5)
    autonomy_level: L4
    risk_level: LOW
    last_verification_date: "2026-09-06"
    verification_record: VERIFICATION_LOG.md#VR-2026-09-06-01

  CAP-002-consent-ledger:
    claim: "Marketing only to provable opt-ins; opt-out instant and permanent."
    purpose: "Anti-ban root control + legal proof of consent."
    inputs:
      - {field: consent_event, source: "qr_scan | ctwa_ad | receipt_capture | keyword+confirm", authority: first_party_db, freshness: at_write}
    processing: {type: rule_engine, algorithm: "append-only ledger {who,when,source,proof}", deterministic: true, model: none, version: n/a}
    output: {type: consent_state, evidence_grade: A}
    permissions: {can_read: [phone_consent], can_infer: [], can_recommend: [], can_execute: [grant_consent, revoke_consent], human_approval_required: false}
    failure_states:
      conflicting_data: "most recent REVOKE always wins"
      provider_failure: "ledger is local-first"
    verification:
      method: "replay ledger → reconstruct every consent; deletion test → proof survives record deletion"
      acceptance_criteria: "0 sends to non-ledger numbers in any test; revoke latency <1s"
      reproducibility: deterministic
    production_status: PROTOTYPE   # keyword consent exists; confirm-step + QR/receipt capture missing (TB-4)
    autonomy_level: L4
    risk_level: HIGH_IF_WRONG
    last_verification_date: null

  CAP-003-catalog-serving:
    claim: "Prices/specs/stock shown are exactly the owner-approved file, always dated, never AI-invented."
    purpose: "Price truth in a price-sensitive market."
    inputs:
      - {field: products.json, source: owner_file, authority: owner, freshness: "TTL 24h then STALE"}
    processing: {type: "schema_validate + sanity_bounds(±25%) + freshness", deterministic: true, model: none, version: schema_v1}
    output: {type: "price_card + evidence{observed_at,status:VERIFIED|STALE}", evidence_grade: "B (owner-file-derived)"}
    permissions: {can_read: [products_file], can_infer: [], can_recommend: [], can_execute: [display_price], human_approval_required: "on >25% price jump in file edit"}
    failure_states:
      stale_data: "reply: 'rates kal ke ho sakte hain — confirm karein'; scarcity counters auto-disabled"
      conflicting_data: "owner file wins over LLM memory ALWAYS"
      provider_failure: "file unreadable → honest 'rates par kaam jaari hai' + handoff; never last-good-as-current (§27)"
    verification:
      method: "fuzz file: bad schema rejected; stale file → STALE badge present"
      acceptance_criteria: "0 undated prices in any output"
      reproducibility: jest
    production_status: PROTOTYPE
    autonomy_level: L2
    risk_level: MEDIUM
    last_verification_date: null

  CAP-004-emi-calculator:
    claim: "Installment math exact, consistent, fully disclosed."
    purpose: "Sell on installments with transparent totals."
    inputs: [{field: "principal, months, policy_rate", source: "products.json + store_policy", authority: owner, freshness: versioned}]
    processing: {type: arithmetic, algorithm: "total = P(1+r·m); monthly = round(total/m)", deterministic: true, model: none, version: emi_v1}
    output: {type: emi_table, evidence_grade: B}
    permissions: {can_read: [prices, policy], can_infer: [], can_recommend: [plans], can_execute: [], human_approval_required: false}
    failure_states: {insufficient_data: "ask model/amount", conflicting_data: "policy file wins"}
    verification:
      method: "unit tests vs hand-calc spreadsheet"
      acceptance_criteria: "100% match; total payable ALWAYS displayed; labeled 'store installment plan' (never implies bank finance)"
      reproducibility: jest
    production_status: PROTOTYPE   # demo-verified; disclosure wording required
    autonomy_level: L2
    risk_level: MEDIUM_IF_MISLABELED
    last_verification_date: null

  CAP-005-tradein-table-quote:
    claim: "Exchange value is 'andazan' from owner table; never binding; physical check prevails."
    purpose: "Footfall-driving trade-in offers with honest wording."
    inputs: [{field: "model_query, condition", source: customer_text, authority: owner_table, freshness: versioned}]
    processing: {type: table_lookup, algorithm: "match row → condition column → value", deterministic: true, model: none, version: ti_v1}
    output: {type: "estimate{value, label:ESTIMATED}", evidence_grade: B}
    permissions: {can_read: [tradein_table], can_infer: [], can_recommend: [value], can_execute: [], human_approval_required: "final binding value = staff only"}
    failure_states: {insufficient_data: "ask model/condition or photo flow"}
    verification:
      method: "unit tests + wording lint: every output carries 'andazan'/ESTIMATED"
      acceptance_criteria: "0 binding-worded estimates"
      reproducibility: jest
    production_status: PROTOTYPE   # demo-verified incl. wording ✅
    autonomy_level: L2
    risk_level: LOW
    last_verification_date: null

  CAP-006-reservation-stock-lock:
    claim: "Reservations are REAL: atomic stock decrement + durable record + 24h expiry release."
    purpose: "Reserve & pickup that never lies (fixes DEBT-01)."
    inputs:
      - {field: stock_count, source: products.json, authority: owner_file, freshness: transactional}
      - {field: customer_phone, source: webhook, authority: meta_sender_id, freshness: per_event}
    processing: {type: "transaction{UPDATE stock WHERE stock>0 atomic; INSERT reservation{token,expires_at}}", deterministic: true, model: none, version: res_v1}
    output: {type: "reservation_token | OUT_OF_STOCK_honest", evidence_grade: B}
    permissions: {can_read: [stock], can_infer: [], can_recommend: [], can_execute: [create_reservation], human_approval_required: false}
    failure_states:
      conflicting_data: "atomic write; concurrent losers → honest waitlist offer"
      provider_failure: "no token unless DB commit confirmed FIRST"
      timeout: "EXECUTION_RESULT_UNKNOWN → never re-issue duplicate token"
    verification:
      method: "chaos: 20 parallel reserves on stock=1 → exactly 1 token, 19 honest refusals; restart mid-flow → no orphan tokens; expiry cron releases stock"
      acceptance_criteria: "0 double-reservations in 10k simulations"
      reproducibility: "jest + chaos script"
    production_status: REDESIGN_REQUIRED   # current code issues phantom tokens (truth violation)
    autonomy_level: L4
    risk_level: HIGH
    last_verification_date: null

  CAP-007-marketing-governor:
    claim: "No marketing message leaves without 6 deterministic checks; suppression heuristic labeled ESTIMATED, internal-only."
    purpose: "Quality-rating protection; anti-ban by design."
    inputs: [{field: "consent, opted_out, engagement, marketing_today, hour_pkt", source: first_party_db, authority: internal, freshness: per_decision}]
    processing: {type: rule_engine, algorithm: "6-gate AND + engagement heuristic(grade C)", deterministic: "gates yes", model: none, version: gov_v1}
    output: {type: "decision{SEND|SUPPRESS, reasons[]}", evidence_grade: "A for gate inputs; C for heuristic"}
    permissions: {can_read: [customer_state], can_infer: [engagement], can_recommend: [], can_execute: [block_send], human_approval_required: "any override of BLOCK"}
    failure_states:
      insufficient_data: "DEFAULT = SUPPRESS (fail closed)"
      stale_data: "quality unknown → assume YELLOW → utility-only"
    verification:
      method: "property tests: crafted states (opt-out, quiet hour, cap hit) must ALWAYS suppress; audit-log completeness check"
      acceptance_criteria: "100% suppression on forbidden states; full audit trail"
      reproducibility: "jest property-based"
    production_status: PROTOTYPE   # logic written but unwired (DEBT-09)
    autonomy_level: L4
    risk_level: HIGH_IF_WRONG
    last_verification_date: null

  CAP-008-human-inbox:
    claim: "Handoff is REAL: queue, claim/lock, SLA timer, context transfer, audit, return-to-AI."
    purpose: "Makes the zero-bug promise true (§18). Removes active STOP condition."
    inputs: [{field: "escalation_event{reason, chat_excerpt}", source: brain, authority: internal, freshness: realtime}]
    processing: {type: "queue + assignment + SLA clock (staff or BSP inbox)", deterministic: true, model: none, version: inbox_v1}
    output: {type: "handoff_state{QUEUED|CLAIMED|RESOLVED|BREACHED_SLA}", evidence_grade: B}
    permissions: {can_read: [chat_history_scoped], can_infer: [], can_recommend: [draft_replies], can_execute: [assign, lock, resolve], human_approval_required: true}
    failure_states:
      provider_failure: "second-channel owner alert"
      timeout: "SLA breach → owner escalation ≤5 min"
    verification:
      method: "37-test suite (19 CAP-008 incl. 12 adversarial) + live drill evidence/cap008-live-drill.txt; spec CAP008_SPEC.md v2.0"
      acceptance_criteria: "auth/authz/tenant/claim-race/suppression/send-path/audit/SLA/failure-paths ALL green — 37/37; live drill: escalate→suppress→claim→conflict→reply→resolve→return→AI live again; restart-persisted"
      reproducibility: "npm test (tests/cap008.test.js) + curl drill script"
    production_status: PILOT   # 2026-09-08 — sandbox-verified; NOT VERIFIED_PRODUCTION until real-WhatsApp staff pilot (Phase 5). §18 STOP condition LIFTED.
    autonomy_level: "L5 orchestration, human in loop"
    risk_level: CRITICAL
    last_verification_date: "2026-09-08"

  CAP-009-ai-interpreter-guarded:
    claim: "LLM interprets intent and drafts language; it NEVER holds price/permission/policy authority."
    purpose: "Natural Urdu/Roman/English conversation without hallucinated facts or injection breaches."
    inputs:
      - {field: customer_text, source: webhook, authority: untrusted, freshness: per_event}
      - {field: catalog_snapshot, source: CAP-003, authority: owner, freshness: "≤24h"}
    processing:
      type: "llm_structured(JSON) → schema_validate → fact_validate(every PKR figure must ∈ catalog∪computed) → policy_validate → wording_validate"
      deterministic: false
      model: "pinned model+version recorded per reply (§21)"
      version: "locked in .env + logged"
    output: {type: "reply | HANDOFF", evidence_grade: "C for intent; A/B only for facts carried from higher-authority sources"}
    permissions: {can_read: [catalog_snapshot, chat_excerpt], can_infer: [intent, language, sentiment_hint], can_recommend: [reply_text], can_execute: [], human_approval_required: "any commitment outside policy"}
    failure_states:
      model_uncertainty: "HANDOFF (fail closed)"
      provider_failure: "rule-based FAQ fallback labeled LIMITED + handoff offer"
      conflicting_data: "catalog wins; bad figure discarded → regenerate once → else HANDOFF"
    verification:
      method: "500-scenario pack (ur/roman/en) + 100-prompt injection red-team"
      acceptance_criteria: "unsafe-action rate = 0 · wrong-price after validator = 0 · floor-breach 0/100 · unsupported-answer ≤2%"
      reproducibility: "eval harness + fixtures (fixtures labeled MOCK)"
    production_status: REDESIGN_REQUIRED   # price validator absent (DEBT-07)
    autonomy_level: "L1 interpret + L3 recommend ONLY — never L4"
    risk_level: CRITICAL
    last_verification_date: null

  CAP-010-menu-flows:
    claim: "Deterministic menus/flows answer safely without LLM cost."
    purpose: "Cheap instant handling of bulk traffic."
    inputs: [{field: button_or_keyword, source: webhook, authority: meta_sender, freshness: per_event}]
    processing: {type: state_machine, algorithm: "router.js FSM", deterministic: true, model: none, version: fsm_v1}
    output: {type: interactive_reply, evidence_grade: B}
    permissions: {can_read: [catalog], can_infer: [], can_recommend: [], can_execute: [send_menu], human_approval_required: false}
    failure_states: {insufficient_data: "fall to CAP-009 → CAP-008"}
    verification:
      method: "FSM path tests — every button id has a handler"
      acceptance_criteria: "0 dead-ends"
      reproducibility: jest
    production_status: PROTOTYPE
    autonomy_level: L4
    risk_level: LOW
    last_verification_date: null

  CAP-011-outbound-dispatcher:
    claim: "Every outbound message is queued, retried, 24h-window-checked, audit-logged; unknown outcomes are EXECUTION_RESULT_UNKNOWN — never fake success (§27)."
    purpose: "Durability under Meta failures; zero lost replies."
    inputs: [{field: outbound_job, source: internal_capabilities, authority: policy_checked_only, freshness: queued}]
    processing: {type: "outbox + worker + exp backoff + DLQ + window gate + idempotency key", deterministic: true, model: none, version: outbox_v1}
    output: {type: "delivery{QUEUED|SENT|DELIVERED|READ|FAILED|UNKNOWN}", evidence_grade: A}
    permissions: {can_read: [outbox], can_infer: [], can_recommend: [], can_execute: [send_via_meta], human_approval_required: false}
    failure_states:
      provider_failure: "retry ×N → DLQ + owner alert"
      timeout: "status UNKNOWN, reconcile via Meta status webhook"
      conflicting_data: "Meta status callback is authority for DELIVERED/READ"
    verification:
      method: "chaos: kill worker mid-send; fake 500s; duplicate status callbacks"
      acceptance_criteria: "0 silent losses; 0 duplicate sends on retry"
      reproducibility: chaos tests
    production_status: PILOT   # VR-2026-09-06-02: retry/DLQ/crash-recovery/no-double-send proven; real Meta failures pending (Phase-5)
    autonomy_level: L4
    risk_level: HIGH
    last_verification_date: "2026-09-06"
    verification_record: VERIFICATION_LOG.md#VR-2026-09-06-02

  CAP-012-owner-brief:
    claim: "Daily 9AM PKT summary = internal aggregates + live quality rating; window-aware delivery."
    purpose: "Owner visibility without dashboard."
    inputs:
      - {field: aggregates, source: first_party_db, authority: internal, freshness: daily}
      - {field: quality_rating, source: meta_api_field, authority: meta, freshness: at_send, note: "UNWIRED today"}
    processing: {type: aggregation, algorithm: "counts + rating fetch", deterministic: true, model: none, version: brief_v1}
    output: {type: daily_brief, evidence_grade: B}
    permissions: {can_read: [db_aggregates, rating_field], can_infer: [], can_recommend: [], can_execute: [send_to_owner], human_approval_required: false}
    failure_states:
      provider_failure: "send with 'rating: UNAVAILABLE' label (§27 — real label, not fake value)"
      window: "owner outside 24h window → hold until owner messages, or use approved utility template"
    verification:
      method: "1-week manual spot-check vs DB queries; window test"
      acceptance_criteria: "counts match exactly"
      reproducibility: "jest + manual week"
    production_status: PROTOTYPE   # cron exists; rating unwired; window bug (DEBT-11)
    autonomy_level: L4
    risk_level: LOW
    last_verification_date: null

